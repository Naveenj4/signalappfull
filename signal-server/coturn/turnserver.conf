# ==============================================================================
# coturn TURN Server Configuration for Signal 1:1 Voice & Video Calls
# Place in: /etc/turnserver.conf
# ==============================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# External Public IP of your VPS (replace with your server's public IP)
# external-ip=YOUR_PUBLIC_VPS_IP

# Realm (must match your domain)
realm=signal.yourcompany.internal

# Shared secret authentication (RFC 5766 REST API scheme)
# This secret MUST match turn.cloudflare.apiToken in config/secrets.bundle.yml
use-auth-secret
static-auth-secret=signal_turn_shared_secret_change_in_production

# Relay Port Range for Media Traffic (UDP)
min-port=49152
max-port=65535

# TLS Certificates (Let's Encrypt or custom CA)
cert=/etc/letsencrypt/live/signal.yourcompany.internal/fullchain.pem
pkey=/etc/letsencrypt/live/signal.yourcompany.internal/privkey.pem

# Security Hardening
no-multicast-peers
no-cli
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Quotas and Rate Limits
total-quota=100
max-bps=3000000
stale-nonce=600

# Logging
log-file=/var/log/turnserver/turn.log
simple-log
verbose
