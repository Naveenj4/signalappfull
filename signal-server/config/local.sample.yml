logging:
  level: INFO
  appenders:
    - type: console
      threshold: ALL
      timeZone: UTC
      target: stdout

tlsKeyStore:
  password: secret://tlsKeyStore.password

dynamoDbClient:
  type: default
  region: us-east-1
  clientExecutionTimeout: PT30S
  clientRequestTimeout: PT10S
  maxConnections: 50

database:
  enabled: true
  jdbcUrl: "jdbc:mysql://${SIGNAL_DB_HOST:-127.0.0.1}:${SIGNAL_DB_PORT:-3306}/${SIGNAL_DB_NAME:-signal}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&rewriteBatchedStatements=true"
  user: "${SIGNAL_DB_USER:-signal}"
  password: "${SIGNAL_DB_PASSWORD:-signal_db_secret_pass}"
  maxPoolSize: 20
  minIdle: 5
  runFlyway: true
  registrationAllowlistOnly: false
  fixedVerificationCodeEnabled: false
  adminApiKey: "${SIGNAL_ADMIN_API_KEY:-signal-admin-secret}"
  twilioAccountSid: "${TWILIO_ACCOUNT_SID:-}"
  twilioAuthToken: "${TWILIO_AUTH_TOKEN:-}"
  twilioFromNumber: "${TWILIO_FROM_NUMBER:-}"
  smsWebhookUrl: "${SMS_WEBHOOK_URL:-}"

dynamoDbTables:
  accounts:
    tableName: accounts_local
    phoneNumberTableName: accounts_phonenumbers_local
    phoneNumberIdentifierTableName: accounts_pni_local
    usernamesTableName: accounts_usernames_local
    usedLinkDeviceTokensTableName: accounts_used_link_tokens_local
  appleDeviceChecks:
    tableName: apple_device_checks_local
  appleDeviceCheckPublicKeys:
    tableName: apple_device_check_keys_local
  backups:
    tableName: backups_local
  changeNumberWaitingPeriods:
    tableName: change_number_waiting_periods_local
  clientReleases:
    tableName: client_releases_local
  deletedAccounts:
    tableName: deleted_accounts_local
  deletedAccountsLock:
    tableName: deleted_accounts_lock_local
  donationPermits:
    tableName: donation_permits_local
    expiration: P7D
  issuedReceipts:
    tableName: issued_receipts_local
    generator: abcdefg12345678=
    maxReceiptsPerSubscriptionPayment:
      STRIPE: 1
      BRAINTREE: 1
      GOOGLE_PLAY_BILLING: 1
      APPLE_APP_STORE: 1
  ecKeys:
    tableName: keys_local
  ecSignedPreKeys:
    tableName: ec_signed_prekeys_local
  pagedPqKeys:
    tableName: paged_pq_keys_local
  pqLastResortKeys:
    tableName: pq_last_resort_keys_local
  messages:
    tableName: messages_local
    expiration: P30D
  onetimeDonations:
    tableName: onetime_donations_local
    expiration: P90D
  phoneNumberIdentifiers:
    tableName: phone_number_identifiers_local
  profileAvatars:
    tableName: profile_avatars_local
  profiles:
    tableName: profiles_local
  profilesV2:
    tableName: profiles_v2_local
  pushChallenge:
    tableName: push_challenge_local
  redeemedReceipts:
    tableName: redeemed_receipts_local
  registrationRecovery:
    tableName: registration_recovery_local
    expiration: P300D
  remoteConfig:
    tableName: remote_config_local
  reportMessage:
    tableName: report_messages_local
  sandboxAccounts:
    tableName: sandbox_accounts_local
  scheduledJobs:
    tableName: scheduled_jobs_local
    expiration: P7D
  subscriptions:
    tableName: subscriptions_local
  verificationSessions:
    tableName: verification_sessions_local

pagedSingleUseKEMPreKeyStore:
  bucket: prekey-bucket
  region: us-east-1

cacheCluster:
  configurationUri: redis://127.0.0.1:6379/

pubsub:
  uri: redis://127.0.0.1:6379/

pushSchedulerCluster:
  configurationUri: redis://127.0.0.1:6379/

rateLimitersCluster:
  configurationUri: redis://127.0.0.1:6379/

directoryV2:
  client:
    userAuthenticationTokenSharedSecret: secret://directoryV2.client.userAuthenticationTokenSharedSecret
    userIdTokenSharedSecret: secret://directoryV2.client.userIdTokenSharedSecret

svr2:
  uri: 127.0.0.1:8080
  userAuthenticationTokenSharedSecret: secret://svr2.userAuthenticationTokenSharedSecret
  userIdTokenSharedSecret: secret://svr2.userIdTokenSharedSecret
  svrCaCertificates: []

svrb:
  uri: 127.0.0.1:8080
  userAuthenticationTokenSharedSecret: secret://svrb.userAuthenticationTokenSharedSecret
  userIdTokenSharedSecret: secret://svrb.userIdTokenSharedSecret
  svrCaCertificates: []

attachments:
  maxAttachmentUploadSizeInBytes: 104857600
  maxMessageBackupUploadSizeInBytes: 104857600

gcpAttachments:
  domain: 127.0.0.1:9000
  email: minio@example.com
  pathPrefix: signal-attachments
  rsaSigningKey: secret://gcpAttachments.rsaSigningKey

tus:
  uploadUri: http://127.0.0.1:9000/upload
  userAuthenticationTokenSharedSecret: secret://tus.userAuthenticationTokenSharedSecret

apn:
  sandbox: true
  bundleId: com.example.textsecuregcm
  keyId: secret://apn.keyId
  teamId: secret://apn.teamId
  signingKey: secret://apn.signingKey

fcm:
  credentials: secret://fcm.credentials

cdn:
  bucket: cdn
  credentials:
    accessKeyId: secret://cdn.accessKey
    secretAccessKey: secret://cdn.accessSecret
  region: us-east-1

cdn3StorageManager:
  baseUri: http://127.0.0.1:9000
  clientId: example
  clientSecret: secret://cdn3StorageManager.clientSecret
  sourceSchemes:
    2: gcs
    3: r2

openTelemetry:
  enabled: false
  environment: dev
  url: http://127.0.0.1:4318/

unidentifiedDelivery:
  certificate: CgIIAQ==
  privateKey: secret://unidentifiedDelivery.privateKey
  expiresDays: 365
  embedSigner: true

shortCode:
  baseUrl: http://127.0.0.1:8080/shortcodes/

storageService:
  uri: 127.0.0.1:8080
  userAuthenticationTokenSharedSecret: secret://storageService.userAuthenticationTokenSharedSecret
  storageCaCertificates: []

callingZkConfigPreV101:
  serverSecret: secret://callingZkConfigPreV101.serverSecret

callingZkConfig:
  serverSecret: secret://callingZkConfigV101.serverSecret

chatZkConfig:
  serverSecret: secret://chatZkConfig.serverSecret

groupsZkConfig:
  serverPublic: 
  serverSecret: secret://zkConfig-libsignal-0.42.serverSecret

dynamicConfig:
  s3Region: us-east-1
  s3Bucket: dynamic-config
  objectKey: dynamic-config.yaml
  maxSize: 100000
  refreshInterval: PT10S

remoteConfig:
  globalConfig:
    EXAMPLE_KEY: VALUE

paymentsService:
  userAuthenticationTokenSharedSecret: secret://paymentsService.userAuthenticationTokenSharedSecret
  paymentCurrencies:
    - MOB
  externalClients:
    fixerApiKey: secret://paymentsService.fixerApiKey
    coinGeckoApiKey: secret://paymentsService.coinGeckoApiKey
    coinGeckoCurrencyIds:
      MOB: mobilecoin

