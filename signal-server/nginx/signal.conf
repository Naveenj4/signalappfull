# ==============================================================================
# Nginx Reverse Proxy Configuration for Self-Hosted Signal Server
# ==============================================================================
# Place in: /etc/nginx/sites-available/signal.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/signal.conf /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name signal.yourcompany.internal; # CHANGE to your domain or VPS IP

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signal.yourcompany.internal; # CHANGE to your domain or VPS IP

    # SSL Certificates (managed by Certbot or custom internal CA)
    ssl_certificate /etc/letsencrypt/live/signal.yourcompany.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal.yourcompany.internal/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Allow attachment uploads up to 120MB (media, voice notes, documents)
    client_max_body_size 120M;

    # Buffering configurations
    proxy_buffers 8 64k;
    proxy_buffer_size 128k;

    # --------------------------------------------------------------------------
    # 1. Admin API: Protect internal administration endpoints
    # --------------------------------------------------------------------------
    location /v1/admin/ {
        # Restrict to local loopback and internal company VPN/admin subnet
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;       # UNCOMMENT and adjust to your corporate VPN subnet
        # allow 192.168.1.0/24;   # UNCOMMENT and adjust to your office network
        deny all;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. WebSocket Push & Message Delivery: Long-lived bidirectional connections
    # --------------------------------------------------------------------------
    location /v1/websocket/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Connection upgrade for WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSockets alive without premature timeout
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. Standard REST API (Accounts, Prekeys, Messages, Profiles)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# ------------------------------------------------------------------------------
# 4. CDN Server Block: MinIO S3 Attachments & Profiles Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.yourcompany.internal; # CHANGE to cdn.<your-domain>

    ssl_certificate /etc/letsencrypt/live/cdn.yourcompany.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.yourcompany.internal/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 120M;

    # MinIO S3 API Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
